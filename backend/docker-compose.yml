name: forreal-backend

services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: forreal
      POSTGRES_PASSWORD: forreal
      POSTGRES_DB: forreal
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forreal"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  web:
    build: .
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    env_file: .env
    environment:
      DATABASE_URL: postgis://forreal:forreal@db:5432/forreal
      REDIS_URL: redis://redis:6379/0
    volumes: [.:/app]
    ports: ["8000:8000"]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_started}

  worker:
    build: .
    command: celery -A config worker -B -l info
    env_file: .env
    environment:
      DATABASE_URL: postgis://forreal:forreal@db:5432/forreal
      REDIS_URL: redis://redis:6379/0
    volumes: [.:/app]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_started}

volumes:
  pgdata:
