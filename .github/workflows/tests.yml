name: tests
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: forreal
          POSTGRES_PASSWORD: forreal
          POSTGRES_DB: forreal
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U forreal" --health-interval 5s --health-retries 10
    env:
      DEBUG: "1"
      DATABASE_URL: postgis://forreal:forreal@localhost:5432/forreal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y gdal-bin libgeos-dev
      - run: pip install -r requirements.txt
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test apps
